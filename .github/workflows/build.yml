name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade pyinstaller PyQt6 pygame requests

    - name: Build EXE with PyInstaller
      run: |
        # Если ваш главный файл называется не main.py, измените его здесь:
        pyinstaller --noconfirm --onedir --windowed --add-data "assets;assets" main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TvLauncher-Windows-EXE
        path: dist/

