name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade buildozer cython

    - name: Build with Buildozer
      run: |
        buildozer -v android debug || (cat .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/dists/tvlauncher/build.log || echo "Log not found")
        exit 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TvLauncher-APK
        path: bin/*.apk

